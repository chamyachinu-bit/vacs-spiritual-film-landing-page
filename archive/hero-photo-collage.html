<!--
  ARCHIVED HERO PHOTO COLLAGE
  Saved for reactivation when a larger approved photo library is available.

  To restore:
  1. Replace the production `.hero-logo-stage` element in index.html with the
     `.hero-mark.hero-constellation` block below.
  2. Keep assets/generated/hero-gallery-1.webp through hero-gallery-9.webp.
  3. The complete responsive collage styling remains in styles.css under the
     `hero-photo-matrix`, `hero-photo-row`, and `hero-diamond` selectors.
-->

    <div class="hero-photo-matrix" aria-hidden="true">
      <div class="hero-photo-row hero-photo-row-1">

      </div>
      <div class="hero-photo-row hero-photo-row-2">
