<style>
:root{--cream:#fff8f1;--paper:#fdf1e6;--orange:#ef5a2a;--magenta:#df2172;--gold:#f79936;--ink:#2b2b2b;--muted:#766b66;--brown:#36231e;--serif:"Playfair Display",Georgia,serif;--sans:"Inter",Arial,sans-serif;--ease:cubic-bezier(.22,1,.36,1)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);background-image:linear-gradient(rgba(255,248,241,.84),rgba(255,248,241,.84)),url("../assets/extracted/paper-texture.webp");background-size:auto,950px auto;color:var(--ink);font-family:var(--sans)}button,a{font:inherit}.shell{width:min(1180px,calc(100% - 48px));margin-inline:auto}.gallery-header{display:flex;align-items:center;justify-content:space-between;min-height:108px;border-bottom:1px solid rgba(54,35,30,.11)}.gallery-brand img{display:block;width:84px;height:auto}.back-link{display:inline-flex;align-items:center;gap:10px;color:var(--brown);font-size:.68rem;font-weight:600;letter-spacing:.16em;text-decoration:none;text-transform:uppercase}.back-link span{color:var(--orange);font-size:1.1rem;transition:transform .25s var(--ease)}.back-link:hover span{transform:translateX(-4px)}.gallery-hero{padding:clamp(70px,10vw,140px) 0 clamp(50px,7vw,90px);text-align:center}.eyebrow{margin:0 0 15px;color:var(--magenta);font-size:.64rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase}.gallery-hero h1{max-width:850px;margin:0 auto;font-family:var(--serif);font-size:clamp(3rem,7.5vw,7rem);font-weight:500;line-height:.88;letter-spacing:-.055em}.gallery-hero h1 em{color:var(--orange);font-weight:500}.gallery-hero p:last-child{max-width:530px;margin:25px auto 0;color:var(--muted);font-size:.86rem;line-height:1.75}.photo-grid{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:dense;gap:12px;padding-bottom:clamp(80px,10vw,140px)}.photo-card{position:relative;grid-column:span 4;margin:0;overflow:hidden;background:#e9dace;cursor:zoom-in;aspect-ratio:4/3}.photo-card.wide{grid-column:span 8;aspect-ratio:16/9}.photo-card.tall{aspect-ratio:3/4}.photo-card img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.94);transition:transform .65s var(--ease),filter .4s ease}.photo-card:after{content:"View";position:absolute;right:14px;bottom:14px;padding:8px 11px;background:rgba(43,28,23,.76);color:#fff8f1;font-size:.55rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:0;transform:translateY(5px);transition:opacity .25s ease,transform .25s var(--ease)}.photo-card:hover img{transform:scale(1.025);filter:saturate(1.06)}.photo-card:hover:after{opacity:1;transform:none}.gallery-footer{padding:32px 0 42px;border-top:1px solid rgba(54,35,30,.11);color:var(--muted);font-size:.65rem;line-height:1.6;text-align:center}.lightbox{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:32px;background:rgba(22,13,11,.94);border:0;width:100%;height:100%;max-width:none;max-height:none}.lightbox[hidden]{display:none}.lightbox img{display:block;max-width:min(1180px,94vw);max-height:88vh;width:auto;height:auto;object-fit:contain;box-shadow:0 35px 100px rgba(0,0,0,.5)}.lightbox-close{position:fixed;top:20px;right:22px;width:44px;height:44px;border:1px solid rgba(255,248,241,.35);border-radius:50%;background:transparent;color:#fff8f1;font-size:1.35rem;cursor:pointer}.lightbox-close:hover{background:var(--orange);border-color:var(--orange)}@media(max-width:850px){.photo-card{grid-column:span 6}.photo-card.wide{grid-column:span 12}}@media(max-width:560px){.shell{width:min(100% - 28px,1180px)}.gallery-header{min-height:88px}.gallery-brand img{width:67px}.gallery-hero{padding-top:58px}.photo-grid{grid-template-columns:1fr;gap:9px}.photo-card,.photo-card.wide{grid-column:auto;aspect-ratio:4/3}.photo-card.tall{aspect-ratio:3/4}.photo-card:after{display:none}.lightbox{padding:14px}.lightbox-close{top:12px;right:12px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.photo-card img,.photo-card:after,.back-link span{transition:none}}

<script>"use strict";document.querySelector("#year").textContent=new Date().getFullYear();const box=document.querySelector("#lightbox"),boxImage=document.querySelector("#lightbox-image"),closeButton=document.querySelector(".lightbox-close");let opener=null;function closeBox(){box.hidden=true;document.body.style.overflow="";opener?.focus()}document.querySelectorAll(".photo-card").forEach(card=>card.addEventListener("click",()=>{const image=card.querySelector("img");opener=card;boxImage.src=image.src;boxImage.alt=image.alt;box.hidden=false;document.body.style.overflow="hidden";closeButton.focus()}));closeButton.addEventListener("click",closeBox);box.addEventListener("click",event=>{if(event.target===box)closeBox()});addEventListener("keydown",event=>{if(event.key==="Escape"&&!box.hidden)closeBox()});</script></body></html>
