<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#110d0c"><title>3D Gallery Study | Vaishvik Adhyatmik Chitranagari Samiti</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--cream:#fff8f1;--gold:#f79936;--night:#110d0c;--serif:"Playfair Display",Georgia,serif;--sans:"Inter",Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--night);color:var(--cream);font-family:var(--sans)}body{overflow:hidden}.stage{position:relative;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 57%,#4d291f 0,#211513 39%,#0c0908 78%)}.stage:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(17,13,12,.72),rgba(17,13,12,.94)),url("../assets/extracted/paper-texture.webp") center/900px auto;mix-blend-mode:soft-light;opacity:.5}.intro{position:relative;z-index:10;width:min(900px,calc(100% - 36px));margin:auto;padding:clamp(22px,3.5vh,42px) 0 0;text-align:center}.eyebrow{margin:0 0 9px;color:var(--gold);font-size:.61rem;font-weight:500;letter-spacing:.3em;text-transform:uppercase}h1{margin:0;font-family:var(--serif);font-size:clamp(2.1rem,4.5vw,4.7rem);font-weight:500;line-height:1;letter-spacing:-.045em;text-wrap:balance}h1 em{color:#f4a046;font-weight:500}.lede{max-width:530px;margin:12px auto 0;color:rgba(255,248,241,.62);font-size:.75rem;line-height:1.65}.scene{display:grid;place-items:center;overflow:hidden;perspective:42em;perspective-origin:50% 52%;mask:linear-gradient(90deg,#0000,#000 9% 91%,#0000);cursor:grab;user-select:none;touch-action:pan-y;outline:none}.scene.dragging{cursor:grabbing}.scene:focus-visible{box-shadow:inset 0 0 0 2px rgba(247,153,54,.65)}.ring{display:grid;place-self:center;transform-style:preserve-3d;will-change:transform}.card{--w:clamp(230px,20vw,300px);--h:clamp(275px,42vh,370px);--gap:9px;--ba:calc(1turn/var(--n));grid-area:1/1;width:var(--w);height:var(--h);padding:0;border:0;background:#130d0b;cursor:pointer;transform:rotateY(calc(var(--i)*var(--ba))) translateZ(calc(-1*(.5*var(--w) + var(--gap))/tan(.5*var(--ba))));backface-visibility:hidden;box-shadow:inset 0 1px rgba(255,255,255,.14),inset 0 -1px rgba(247,153,54,.34),0 28px 65px rgba(0,0,0,.52);transition:filter .35s ease,box-shadow .35s ease;overflow:hidden}.card[aria-current="true"]{box-shadow:inset 0 1px rgba(255,255,255,.14),inset 0 -1px rgba(247,153,54,.34),0 28px 65px rgba(0,0,0,.52)}.spr{height:27px;background-color:#281a17;background-image:radial-gradient(ellipse 6px 4px at 9px 50%,#050303 65%,rgba(247,153,54,.34) 70%,transparent 78%);background-size:18px 12px;background-repeat:repeat-x;background-position:left center;box-shadow:0 1px rgba(255,255,255,.1),inset 0 0 8px rgba(0,0,0,.78)}.spr:last-child{transform:scaleY(-1)}.gate{position:relative;height:calc(100% - 54px);overflow:hidden;border-inline:5px solid #0b0706;background:#080505}.gate:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 31%,rgba(255,236,196,.14) 49%,transparent 64%),linear-gradient(0deg,rgba(0,0,0,.16),transparent 45%);pointer-events:none}.gate img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.98) brightness(.9) contrast(1.04);transform:scale(1.025);transition:filter .45s ease,transform .7s cubic-bezier(.2,.8,.2,1)}.card[aria-current="true"] img,.card:hover img{filter:saturate(.98) brightness(.9) contrast(1.04);transform:scale(1.025)}.footer{display:flex;align-items:center;justify-content:center;gap:14px;min-height:60px;padding:0 20px 18px;color:rgba(255,248,241,.46);font-size:.53rem;letter-spacing:.17em;text-transform:uppercase}.footer:before,.footer:after{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}.footer:after{transform:scaleX(-1)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:600px){.intro{padding-top:22px}.lede{max-width:320px;font-size:.68rem}.scene{perspective:31em;mask:linear-gradient(90deg,#0000,#000 5% 95%,#0000)}.card{--w:min(66vw,238px);--h:min(39vh,292px);--gap:7px}.footer{padding-bottom:14px}}
</style></head><body><main class="stage"><header class="intro"><p class="eyebrow">The gallery</p><h1>Moments in stillness. <em>Stories in motion.</em></h1><p class="lede">A living film of shared presence, creative expression and inner connection.</p></header><section class="scene" id="scene" tabindex="0" aria-label="Three-dimensional photograph carousel. Use left and right arrow keys to explore."><div class="ring" id="ring"></div><p class="sr-only" id="live" aria-live="polite"></p></section><div class="footer"><span id="status">Rotating · drag to explore</span></div></main>
<script>
"use strict";
// Add future images only here; the ring count and geometry update automatically.
const images=Array.from({length:9},(_,i)=>({src:`Image ${i+1}.jpg`,alt:`Gallery moment ${i+1}`})),scene=document.querySelector("#scene"),ring=document.querySelector("#ring"),status=document.querySelector("#status"),live=document.querySelector("#live"),reduced=matchMedia("(prefers-reduced-motion:reduce)").matches,N=images.length,step=360/N;
ring.style.setProperty("--n",N);const cards=images.map((item,i)=>{const card=document.createElement("button");card.className="card";card.type="button";card.tabIndex=-1;card.style.setProperty("--i",i);card.setAttribute("aria-label",item.alt);card.innerHTML=`<div class="spr"></div><div class="gate"><img src="${item.src}" width="1600" height="1067" alt="${item.alt}" ${i>4?'loading="lazy"':''}></div><div class="spr"></div>`;ring.append(card);return card});
let angle=0,last=0,hovering=false,dragging=false,startX=0,lastX=0,lastMove=0,velocity=0,target=null,current=-1;const wrapDeg=v=>((v%360)+360)%360;
function nearestIndex(){return Math.round(wrapDeg(-angle)/step)%N}function updateCurrent(){const i=nearestIndex();if(i===current)return;cards[current]?.removeAttribute("aria-current");current=i;cards[i].setAttribute("aria-current","true");live.textContent=`${images[i].alt} centred`}
function frame(t){const dt=Math.min(34,t-last||16);last=t;if(!dragging){if(target!==null){let delta=((target-angle+540)%360)-180;angle+=delta*Math.min(1,dt*.012);if(Math.abs(delta)<.04){angle=target;target=null}}else if(!reduced){angle+=(hovering?.004:.012)*dt+velocity*dt;velocity*=Math.pow(.91,dt/16.67);if(Math.abs(velocity)<.00005)velocity=0}}ring.style.transform=`rotateY(${angle}deg)`;updateCurrent();requestAnimationFrame(frame)}
function centre(i){target=-i*step+Math.round((angle+i*step)/360)*360;velocity=0}cards.forEach((card,i)=>card.addEventListener("click",()=>centre(i)));scene.addEventListener("pointerenter",()=>{hovering=true;status.textContent="Slow motion · drag to explore"});scene.addEventListener("pointerleave",()=>{hovering=false;dragging=false;scene.classList.remove("dragging");status.textContent="Rotating · drag to explore"});scene.addEventListener("pointerdown",e=>{dragging=true;target=null;velocity=0;startX=lastX=e.clientX;lastMove=e.timeStamp;scene.setPointerCapture(e.pointerId);scene.classList.add("dragging")});scene.addEventListener("pointermove",e=>{if(!dragging)return;const dx=e.clientX-lastX,dt=Math.max(8,e.timeStamp-lastMove);angle+=dx*.34;velocity=Math.max(-.25,Math.min(.25,dx*.34/dt));lastX=e.clientX;lastMove=e.timeStamp});scene.addEventListener("pointerup",e=>{dragging=false;scene.classList.remove("dragging");if(Math.abs(e.clientX-startX)<5)centre(nearestIndex())});scene.addEventListener("keydown",e=>{if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;e.preventDefault();centre((current+(e.key==="ArrowRight"?1:-1)+N)%N)});requestAnimationFrame(frame);
</script></body></html>
