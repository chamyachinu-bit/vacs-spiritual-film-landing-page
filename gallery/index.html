<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#110d0c">
  <title>Gallery | Vaishvik Adhyatmik Chitranagari Samiti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#fff8f1;--gold:#f79936;--night:#110d0c;--serif:"Playfair Display",Georgia,serif;--sans:"Inter",Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--night);color:var(--cream);font-family:var(--sans)}body{overflow:hidden}button{font:inherit}
    .stage{position:relative;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 57%,#48271e 0,#211513 39%,#0c0908 78%)}.stage:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(17,13,12,.75),rgba(17,13,12,.94)),url("../assets/extracted/paper-texture.webp") center/900px auto;mix-blend-mode:soft-light;opacity:.48}
    .intro{position:relative;z-index:10;width:min(900px,calc(100% - 36px));margin:auto;padding:clamp(24px,4vh,46px) 0 0;text-align:center}.eyebrow{margin:0 0 9px;color:var(--gold);font-size:.61rem;font-weight:500;letter-spacing:.3em;text-transform:uppercase}h1{margin:0;font-family:var(--serif);font-size:clamp(2.1rem,4.5vw,4.7rem);font-weight:500;line-height:1;letter-spacing:-.045em;text-wrap:balance}h1 em{color:#f4a046;font-weight:500}.lede{max-width:530px;margin:12px auto 0;color:rgba(255,248,241,.58);font-size:.75rem;line-height:1.65}
    .gallery{position:relative;align-self:center;width:100%;height:clamp(400px,59vh,620px);perspective:920px;perspective-origin:50% 48%;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none}.gallery.dragging{cursor:grabbing}.gallery:before,.gallery:after{content:"";position:absolute;z-index:20;inset:0 auto 0 0;width:9vw;background:linear-gradient(90deg,#0c0908,transparent);pointer-events:none}.gallery:after{left:auto;right:0;rotate:180deg}.ribbon{position:absolute;inset:0;transform-style:preserve-3d}
    .cell{--w:clamp(230px,24vw,370px);position:absolute;left:50%;top:50%;width:var(--w);height:clamp(205px,23vw,330px);border:0;padding:32px 11px;background:linear-gradient(180deg,#33231f,#17100f 15%,#0d0908 50%,#1a1210 86%,#38251f);box-shadow:inset 0 1px rgba(255,255,255,.16),inset 0 -1px rgba(247,153,54,.45),0 30px 70px rgba(0,0,0,.55);transform-origin:center;transform-style:preserve-3d;backface-visibility:hidden;will-change:transform,opacity;cursor:pointer}.cell:before,.cell:after{content:"";position:absolute;z-index:4;left:0;right:0;height:21px;background-color:#281a17;background-image:radial-gradient(ellipse 6px 4px at 9px 50%,#070505 65%,rgba(247,153,54,.32) 70%,transparent 78%);background-size:18px 12px;background-repeat:repeat-x;background-position:left center;box-shadow:0 1px rgba(255,255,255,.12),inset 0 0 8px rgba(0,0,0,.75)}.cell:before{top:6px}.cell:after{bottom:6px;transform:scaleY(-1)}
    .gate{position:relative;display:block;width:100%;height:100%;overflow:hidden;background:#070505;border:1px solid rgba(247,153,54,.38);box-shadow:inset 0 0 0 5px #0d0908,inset 0 0 30px rgba(0,0,0,.7);transform:translateZ(7px)}.gate:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,235,190,.2) 49%,transparent 63%),linear-gradient(0deg,rgba(0,0,0,.25),transparent 42%);pointer-events:none}.cell img{display:block;width:100%;height:100%;object-fit:cover;filter:grayscale(.7) sepia(.1) brightness(.68) contrast(1.08);transform:scale(1.035);transition:filter .4s ease,transform .7s cubic-bezier(.2,.8,.2,1)}.cell.active img{filter:grayscale(0) saturate(1.05) brightness(.95);transform:scale(1.07)}.cell.active .gate{border-color:rgba(255,190,88,.85)}.cell.active{box-shadow:inset 0 1px rgba(255,255,255,.2),0 0 38px rgba(247,153,54,.17),0 36px 78px rgba(0,0,0,.58)}.cell:focus-visible{outline:2px solid var(--gold);outline-offset:5px}
    .cell.active .gate:before{content:"";position:absolute;z-index:3;inset:-35%;background:linear-gradient(108deg,transparent 38%,rgba(255,238,187,.08) 45%,rgba(255,255,255,.5) 50%,transparent 58%);translate:-120%;animation:glimmer 5s ease-in-out infinite;pointer-events:none}.footer{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;gap:14px;min-height:62px;padding:0 20px 20px;color:rgba(255,248,241,.42);font-size:.53rem;letter-spacing:.17em;text-transform:uppercase}.footer:before,.footer:after{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}.footer:after{rotate:180deg}@keyframes glimmer{0%,58%{translate:-120%;opacity:0}66%{opacity:1}86%,100%{translate:120%;opacity:0}}
    @media(max-width:700px){.intro{padding-top:22px}.lede{max-width:330px;font-size:.68rem}.gallery{height:500px;perspective:720px}.cell{--w:220px;height:230px;padding:28px 9px}.cell:before,.cell:after{height:18px;background-size:15px 10px;background-image:radial-gradient(ellipse 5px 3.5px at 7.5px 50%,#070505 66%,rgba(247,153,54,.32) 70%,transparent 78%)}.cell:before{top:5px}.cell:after{bottom:5px}.footer{padding-bottom:15px}}@media(prefers-reduced-motion:reduce){body{overflow:auto}.gallery{height:auto;min-height:320px;overflow-x:auto;perspective:none;padding:38px 22px;scroll-snap-type:x mandatory}.ribbon{position:relative;display:flex;inset:auto}.cell{position:relative;left:auto;top:auto;flex:0 0 min(78vw,300px);transform:none!important;opacity:1!important;scroll-snap-align:center}.cell img{filter:none}.cell.active .gate:before{display:none}}
  </style>
</head>
<body>
  <main class="stage"><header class="intro"><p class="eyebrow">The gallery</p><h1>Moments in stillness. <em>Stories in motion.</em></h1><p class="lede">A living film of shared presence, creative expression and inner connection.</p></header><section class="gallery" id="gallery" aria-label="Continuous three-dimensional event photograph gallery"><div class="ribbon" id="ribbon"></div></section><div class="footer"><span id="status">Playing · drag to explore</span></div></main>
  <script>
    "use strict";const images=Array.from({length:9},(_,i)=>({src:"Image "+(i+1)+".jpg",alt:"Gallery moment "+(i+1)})),items=[...images,...images],gallery=document.querySelector("#gallery"),ribbon=document.querySelector("#ribbon"),status=document.querySelector("#status"),reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
    const cells=items.map((item,index)=>{const button=document.createElement("button");button.className="cell";button.type="button";button.setAttribute("aria-label","View "+item.alt);button.innerHTML='<span class="gate"><img src="'+item.src+'" width="1600" height="1067" alt="'+item.alt+'" '+(index>5?'loading="lazy"':'')+'></span>';ribbon.append(button);return button});let offset=0,last=0,dragging=false,hovering=false,startX=0,active=-1;const wrap=(v,size)=>((v%size)+size)%size;function spacingFor(w){return w<700?206:Math.max(268,Math.min(352,w/4.3))}
    function layout(){if(reduced)return;const w=gallery.clientWidth,mobile=w<700,spacing=spacingFor(w),cycle=spacing*cells.length,range=w*.85+spacing;let nearest={distance:Infinity,index:0};cells.forEach((cell,index)=>{let x=wrap(index*spacing+offset+range,cycle)-range;if(x>range-spacing)x-=cycle;const n=Math.max(-1.35,Math.min(1.35,x/(w*.5))),edge=Math.min(1,Math.abs(n)),y=(mobile?72:116)*(1-edge*edge)-(mobile?24:42),z=-(1-edge)*(mobile?230:400),scale=(mobile?.72:.66)+edge*(mobile?.22:.36),ry=-n*(mobile?42:54),rz=n*(mobile?4:6),opacity=Math.max(.14,.98-edge*.34);cell.style.transform='translate3d(calc(-50% + '+x+'px),calc(-50% + '+y+'px),'+z+'px) rotateY('+ry+'deg) rotateZ('+rz+'deg) scale('+scale+')';cell.style.opacity=opacity;cell.style.zIndex=String(Math.round(edge*100));if(Math.abs(x)<nearest.distance)nearest={distance:Math.abs(x),index}});if(nearest.index!==active){cells[active]?.classList.remove("active");active=nearest.index;cells[active].classList.add("active")}}function tick(time){const dt=Math.min(34,time-last||16);last=time;if(!dragging&&!document.hidden)offset-=(hovering?8:28)*dt/1000;layout();requestAnimationFrame(tick)}
    gallery.addEventListener("pointerenter",()=>{hovering=true;status.textContent="Slow motion · drag to explore"});gallery.addEventListener("pointerleave",()=>{hovering=false;dragging=false;gallery.classList.remove("dragging");status.textContent="Playing · drag to explore"});gallery.addEventListener("pointerdown",e=>{dragging=true;startX=e.clientX;gallery.classList.add("dragging");gallery.setPointerCapture(e.pointerId)});gallery.addEventListener("pointermove",e=>{if(!dragging)return;offset+=e.clientX-startX;startX=e.clientX;layout()});gallery.addEventListener("pointerup",()=>{dragging=false;gallery.classList.remove("dragging")});cells.forEach((cell,index)=>cell.addEventListener("click",()=>{if(reduced)return;const spacing=spacingFor(gallery.clientWidth),cycle=spacing*cells.length,current=wrap(index*spacing+offset+cycle/2,cycle)-cycle/2;offset-=current;layout()}));addEventListener("resize",layout,{passive:true});if(reduced)cells[0]?.classList.add("active");else requestAnimationFrame(tick);
  </script>
</body>
</html>
