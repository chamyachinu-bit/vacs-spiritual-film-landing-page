<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1f1714">
  <title>Cinematic Film Gallery Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#fff8f1;--orange:#ef5a2a;--gold:#f79936;--magenta:#df2172;--brown:#603813;--night:#1f1714;--night-2:#34211c;--serif:"Playfair Display",Georgia,serif;--sans:"Inter",Arial,sans-serif}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--night);color:var(--cream);font-family:var(--sans)}
    body{overflow-x:hidden;background:radial-gradient(circle at 50% 48%,#432920 0,#281a17 42%,#15100e 100%)}
    button{font:inherit}
    .prototype{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;isolation:isolate}
    .prototype:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(rgba(31,23,20,.78),rgba(31,23,20,.92)),url("assets/extracted/paper-texture.webp");background-size:auto,1000px auto;mix-blend-mode:soft-light;opacity:.5}
    .prototype:after{content:"";position:fixed;z-index:-1;width:560px;aspect-ratio:1;border-radius:50%;left:50%;top:48%;translate:-50% -50%;background:radial-gradient(circle,rgba(247,153,54,.13),rgba(223,33,114,.045) 48%,transparent 70%);filter:blur(20px);pointer-events:none}
    .intro{position:relative;z-index:4;width:min(1100px,calc(100% - 40px));margin:0 auto;padding:clamp(28px,5vh,54px) 0 8px;text-align:center}
    .eyebrow{margin:0 0 10px;color:var(--gold);font-size:.66rem;font-weight:600;letter-spacing:.26em;text-transform:uppercase}
    h1{max-width:800px;margin:auto;font-family:var(--serif);font-size:clamp(2.15rem,4.8vw,4.8rem);font-weight:500;line-height:1.02;letter-spacing:-.04em;text-wrap:balance}
    h1 em{color:var(--orange);font-weight:500}
    .lede{max-width:620px;margin:14px auto 0;color:rgba(255,248,241,.62);font-size:.84rem;line-height:1.6}
    .gallery-shell{position:relative;align-self:center;width:100%;height:clamp(390px,54vw,610px);perspective:1200px;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none}
    .gallery-shell.is-dragging{cursor:grabbing}
    .gallery-shell:before,.gallery-shell:after{content:"";position:absolute;z-index:8;inset:0 auto 0 0;width:15%;background:linear-gradient(90deg,var(--night),transparent);pointer-events:none}
    .gallery-shell:after{left:auto;right:0;rotate:180deg}
    .film-rail{position:absolute;z-index:1;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;filter:drop-shadow(0 12px 22px rgba(0,0,0,.34))}
    .rail-body{fill:none;stroke:url(#rail-gradient);stroke-width:24;vector-effect:non-scaling-stroke}
    .rail-holes{fill:none;stroke:#241816;stroke-width:9;stroke-linecap:butt;stroke-dasharray:6 12;vector-effect:non-scaling-stroke}
    .film-frames{position:absolute;z-index:3;inset:0;transform-style:preserve-3d}
    .film-frame{position:absolute;left:50%;top:50%;width:clamp(112px,13vw,205px);aspect-ratio:.78;border:0;padding:0;background:#110c0b;overflow:hidden;box-shadow:0 22px 55px rgba(0,0,0,.42);transform-origin:center;will-change:transform,opacity;cursor:pointer;transition:filter .25s ease,box-shadow .25s ease;backface-visibility:hidden}
    .film-frame:before{content:"";position:absolute;z-index:2;inset:0;border:1px solid rgba(255,248,241,.16);box-shadow:inset 0 0 24px rgba(0,0,0,.26);pointer-events:none}
    .film-frame img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top;filter:grayscale(.85) sepia(.1) brightness(.72);transition:filter .35s ease,transform .55s cubic-bezier(.23,1,.32,1)}
    .film-frame.is-focus{box-shadow:0 0 0 1px rgba(247,153,54,.7),0 18px 55px rgba(247,153,54,.2)}
    .film-frame.is-focus img{filter:grayscale(0) saturate(1.02) brightness(1);transform:scale(1.025)}
    .film-frame:focus-visible{outline:2px solid var(--gold);outline-offset:5px}
    .focus-glimmer{position:absolute;z-index:6;left:50%;top:50%;width:clamp(120px,15vw,225px);height:66%;translate:-50% -50%;pointer-events:none;overflow:hidden;opacity:.8}
    .focus-glimmer:after{content:"";position:absolute;inset:-30%;background:linear-gradient(110deg,transparent 39%,rgba(255,240,184,.3) 47%,rgba(255,255,255,.75) 50%,transparent 58%);translate:-140% 0;animation:glimmer 5.5s ease-in-out infinite}
    .gallery-caption{position:relative;z-index:10;align-self:end;display:flex;align-items:center;justify-content:center;gap:12px;min-height:70px;padding:6px 20px 26px;text-align:center}
    .gallery-caption:before,.gallery-caption:after{content:"";width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}.gallery-caption:after{rotate:180deg}
    .gallery-caption strong{display:block;font-family:var(--serif);font-size:clamp(1rem,2vw,1.35rem);font-weight:500}.gallery-caption span{display:block;margin-top:3px;color:rgba(255,248,241,.5);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase}
    .status{position:absolute;left:18px;bottom:16px;z-index:12;color:rgba(255,248,241,.42);font-size:.56rem;letter-spacing:.16em;text-transform:uppercase}
    @keyframes glimmer{0%,58%{translate:-140% 0;opacity:0}67%{opacity:1}84%,100%{translate:140% 0;opacity:0}}
    @media(max-width:700px){
      .intro{padding-top:24px}.lede{font-size:.76rem}.gallery-shell{height:460px;perspective:800px}.film-frame{width:138px}.gallery-shell:before,.gallery-shell:after{width:9%}.rail-body{stroke-width:18}.rail-holes{stroke-width:6;stroke-dasharray:4 9}.focus-glimmer{width:148px;height:56%}.gallery-caption{padding-bottom:22px}.status{display:none}
    }
    @media(prefers-reduced-motion:reduce){
      .gallery-shell{height:auto;min-height:360px;overflow-x:auto;perspective:none;cursor:auto;scroll-snap-type:x mandatory;padding:48px 22px}.film-rail,.focus-glimmer{display:none}.film-frames{position:relative;display:flex;gap:14px;inset:auto;transform:none}.film-frame{position:relative;left:auto;top:auto;flex:0 0 min(68vw,230px);transform:none!important;opacity:1!important;scroll-snap-align:center}.film-frame img{filter:none}.gallery-caption{display:none}
    }
  </style>
</head>
<body>
  <main class="prototype">
    <header class="intro">
      <p class="eyebrow">Cinematic gallery prototype</p>
      <h1>Stories carried on a <em>living film ribbon.</em></h1>
      <p class="lede">A continuous gallery study using approved website portraits. Hover to pause, drag to explore, or focus a portrait with the keyboard.</p>
    </header>

    <section class="gallery-shell" aria-label="Continuously moving portrait gallery">
      <svg class="film-rail" viewBox="0 0 1440 560" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="rail-gradient" x1="0" x2="1"><stop offset="0" stop-color="#8a4a28"/><stop offset=".18" stop-color="#ef5a2a"/><stop offset=".5" stop-color="#f79936"/><stop offset=".82" stop-color="#df2172"/><stop offset="1" stop-color="#8a4a28"/></linearGradient></defs>
        <path class="rail-body" d="M-20 106 Q720 224 1460 106"/>
        <path class="rail-holes" d="M-20 106 Q720 224 1460 106"/>
        <path class="rail-body" d="M-20 454 Q720 336 1460 454"/>
        <path class="rail-holes" d="M-20 454 Q720 336 1460 454"/>
      </svg>
      <div class="film-frames" id="film-frames"></div>
      <div class="focus-glimmer" aria-hidden="true"></div>
      <div class="status" id="status">Playing · hover to pause</div>
    </section>

    <div class="gallery-caption" aria-live="polite"><div><strong id="caption-name">Smita Jayakar</strong><span id="caption-role">Actor &amp; Spiritual Healer</span></div></div>
  </main>

  <script>
    "use strict";
    const portraits=[
      {name:"Smita Jayakar",role:"Actor & Spiritual Healer",src:"assets/images/smita-jayakar.webp"},
      {name:"Makarand Deshpande",role:"Actor, Writer & Director",src:"assets/images/makarand-deshpande-portrait.webp"},
      {name:"Kajal Aggrawal",role:"Actor & Entrepreneur",src:"assets/images/kajal-aggrawal.webp"},
      {name:"Addinath Kothare",role:"Actor, Writer & Director",src:"assets/images/addinath-kothare.webp"},
      {name:"Aaditi Pohankar",role:"Actor",src:"assets/images/aaditi-pohankar.webp"},
      {name:"Shaan Uttamsingh",role:"Entrepreneur",src:"assets/images/shaan-uttamsingh.webp"},
      {name:"Maitreyi Saundarya",role:"Spiritual Guide & Speaker",src:"assets/images/maitreyi-saundarya.webp"},
      {name:"Maitreya Dadashreeji",role:"Visionary & Guiding Light",src:"assets/images/dadashreeji.webp"}
    ];
    const shell=document.querySelector(".gallery-shell"),track=document.querySelector("#film-frames"),captionName=document.querySelector("#caption-name"),captionRole=document.querySelector("#caption-role"),status=document.querySelector("#status");
    const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
    const cards=portraits.map((person,index)=>{const button=document.createElement("button");button.className="film-frame";button.type="button";button.setAttribute("aria-label",`${person.name}, ${person.role}`);button.innerHTML=`<img src="${person.src}" width="900" height="1200" alt="${person.name}" ${index>3?'loading="lazy"':''}>`;button.addEventListener("focus",()=>setPaused(true));button.addEventListener("blur",()=>setPaused(false));button.addEventListener("click",()=>centreCard(index));track.append(button);return button});
    let phase=0,velocity=42,lastTime=0,paused=false,dragging=false,pointerX=0,focusIndex=-1;
    function setPaused(value){paused=value;status.textContent=value?"Paused":"Playing · hover to pause"}
    function wrap(value,size){return((value%size)+size)%size}
    function layout(){
      if(reduced)return;
      const width=shell.clientWidth,mobile=width<700,spacing=mobile?154:Math.max(150,Math.min(225,width/6.3)),cycle=spacing*cards.length,half=width/2+spacing;
      let nearest={distance:Infinity,index:0};
      cards.forEach((card,index)=>{
        let x=wrap(index*spacing+phase+half,cycle)-half;
        const ratio=Math.max(-1.2,Math.min(1.2,x/(width*.5))),edge=Math.min(1,Math.abs(ratio)),y=(mobile?60:92)*ratio*ratio-(mobile?12:24),scale=1-edge*(mobile?.22:.32),rotateY=-ratio*(mobile?24:38),rotateZ=ratio*(mobile?2.2:3.8),opacity=Math.max(.16,1-edge*.72),z=Math.round((1-edge)*100);
        card.style.transform=`translate3d(calc(-50% + ${x}px),calc(-50% + ${y}px),${z}px) rotateY(${rotateY}deg) rotateZ(${rotateZ}deg) scale(${scale})`;
        card.style.opacity=opacity;card.style.zIndex=String(z);
        if(Math.abs(x)<nearest.distance)nearest={distance:Math.abs(x),index};
      });
      if(nearest.index!==focusIndex){cards[focusIndex]?.classList.remove("is-focus");focusIndex=nearest.index;cards[focusIndex].classList.add("is-focus");captionName.textContent=portraits[focusIndex].name;captionRole.textContent=portraits[focusIndex].role}
    }
    function animate(time){const delta=Math.min(40,time-lastTime||16);lastTime=time;if(!paused&&!dragging)phase-=velocity*delta/1000;layout();requestAnimationFrame(animate)}
    function centreCard(index){if(reduced)return;const width=shell.clientWidth,spacing=width<700?154:Math.max(150,Math.min(225,width/6.3)),cycle=spacing*cards.length,current=wrap(index*spacing+phase+cycle/2,cycle)-cycle/2;phase-=current;layout()}
    shell.addEventListener("pointerenter",()=>setPaused(true));shell.addEventListener("pointerleave",()=>{dragging=false;setPaused(false)});shell.addEventListener("pointerdown",event=>{dragging=true;pointerX=event.clientX;shell.setPointerCapture(event.pointerId)});shell.addEventListener("pointermove",event=>{if(!dragging)return;const delta=event.clientX-pointerX;pointerX=event.clientX;phase+=delta;layout()});shell.addEventListener("pointerup",()=>{dragging=false});
    addEventListener("resize",layout,{passive:true});document.addEventListener("visibilitychange",()=>setPaused(document.hidden));
    if(reduced)cards[0]?.classList.add("is-focus");else requestAnimationFrame(animate);
  </script>
</body>
</html>
